<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PayPaz 渠道 · 合作伙伴 · 佣金分配系统</title>
<style>
/* ============================================================
   PayPaz Manage Console — element-plus / RuoYi-Vue-Plus look-alike
   Tokens grounded in paypaz-manage-web:
     primary #409eff | sidebar #08090a | sidebar hover #263445
   ============================================================ */
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Helvetica,
              "PingFang SC","Hiragino Sans GB","Microsoft YaHei",Arial,sans-serif;
  font-size:14px;
  color:#303133;
  background:#f0f2f5;
  -webkit-font-smoothing:antialiased;
}
:root{
  --el-primary:#409eff;
  --el-primary-light:#ecf5ff;
  --el-success:#67c23a;
  --el-success-light:#f0f9eb;
  --el-warning:#e6a23c;
  --el-warning-light:#fdf6ec;
  --el-danger:#f56c6c;
  --el-danger-light:#fef0f0;
  --el-info:#909399;
  --el-info-light:#f4f4f5;
  --t-primary:#303133;
  --t-regular:#606266;
  --t-secondary:#909399;
  --t-placeholder:#a8abb2;
  --bd-base:#dcdfe6;
  --bd-light:#e4e7ed;
  --bd-lighter:#ebeef5;
  --side-bg:#08090a;
  --side-sub-bg:#0c0d0f;
  --side-hover:#263445;
  --side-text:#bfcbd9;
}
a{color:var(--el-primary);text-decoration:none}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#c0c4cc;border-radius:4px}
::-webkit-scrollbar-track{background:transparent}

/* ---------- layout shell ---------- */
.app{display:flex;height:100vh;overflow:hidden}
.sidebar{
  width:220px;flex:0 0 220px;background:var(--side-bg);
  box-shadow:2px 0 6px rgba(0,21,41,.35);
  height:100%;overflow-y:auto;overflow-x:hidden;
  transition:width .28s;
}
.sidebar::-webkit-scrollbar-thumb{background:#2b3542}
.side-logo{
  height:50px;display:flex;align-items:center;gap:9px;padding:0 14px;
  background:#0a0b0d;border-bottom:1px solid #16181b;position:sticky;top:0;z-index:3;
}
.side-logo .mark{
  width:24px;height:24px;border-radius:5px;flex:0 0 24px;
  background:linear-gradient(140deg,#409eff,#1d6fd0);
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:12px;font-weight:700;letter-spacing:-.5px;
}
.side-logo .txt{color:#fff;font-size:14.5px;font-weight:600;letter-spacing:.3px;white-space:nowrap}
.side-logo .env{
  font-size:10px;color:#8a9099;border:1px solid #2c3238;border-radius:3px;
  padding:0 4px;line-height:15px;margin-left:auto;
}
.menu{padding:4px 0 30px}
.menu-item,.menu-title{
  display:flex;align-items:center;gap:9px;
  height:44px;padding:0 14px;color:var(--side-text);
  font-size:13.5px;cursor:pointer;white-space:nowrap;user-select:none;
  border-left:3px solid transparent;
}
.menu-item:hover,.menu-title:hover{background:var(--side-hover);color:#fff}
.menu-item.active{background:#0e1620;color:var(--el-primary);border-left-color:var(--el-primary)}
.menu-item .ico,.menu-title .ico{flex:0 0 16px;display:flex}
.menu-item .ico svg,.menu-title .ico svg{width:16px;height:16px}
.menu-title .arrow{
  margin-left:auto;width:0;height:0;
  border-left:4px solid currentColor;border-top:4px solid transparent;border-bottom:4px solid transparent;
  transition:transform .2s;opacity:.7;
}
.menu-group.open .menu-title .arrow{transform:rotate(90deg)}
.submenu{display:none;background:var(--side-sub-bg)}
.menu-group.open .submenu{display:block}
.submenu .menu-item{height:40px;padding-left:38px;font-size:13px}
.submenu .menu-item::before{
  content:"";width:4px;height:4px;border-radius:50%;background:#4a5461;
  position:absolute;margin-left:-14px;
}
.submenu .menu-item.active::before{background:var(--el-primary)}
.menu-badge{
  margin-left:auto;background:var(--el-danger);color:#fff;font-size:11px;
  line-height:16px;min-width:16px;text-align:center;border-radius:8px;padding:0 5px;
}

.main{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden}
.navbar{
  height:50px;flex:0 0 50px;background:#fff;display:flex;align-items:center;
  padding:0 16px 0 10px;box-shadow:0 1px 4px rgba(0,21,41,.08);position:relative;z-index:5;
}
.hamburger{
  width:30px;height:30px;display:flex;flex-direction:column;justify-content:center;
  gap:4px;padding:0 6px;cursor:pointer;
}
.hamburger i{display:block;height:2px;background:#5a5e66;border-radius:1px}
.breadcrumb{display:flex;align-items:center;gap:6px;font-size:14px;margin-left:6px}
.breadcrumb .bc{color:var(--t-secondary);cursor:default}
.breadcrumb .bc.link{color:var(--t-regular);cursor:pointer}
.breadcrumb .bc.link:hover{color:var(--el-primary)}
.breadcrumb .sep{color:#c0c4cc}
.nav-right{margin-left:auto;display:flex;align-items:center;gap:16px}
.nav-right .nb{
  display:flex;align-items:center;gap:5px;font-size:13px;color:var(--t-regular);cursor:pointer;
}
.nav-right .nb:hover{color:var(--el-primary)}
.nav-right .nb svg{width:16px;height:16px}
.avatar{
  width:28px;height:28px;border-radius:50%;background:#409eff;color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;
}
.dot-red{width:6px;height:6px;border-radius:50%;background:var(--el-danger);margin-left:-8px;margin-top:-10px}

.tags-view{
  height:34px;flex:0 0 34px;background:#fff;border-bottom:1px solid #d8dce5;
  box-shadow:0 1px 3px 0 rgba(0,0,0,.12),0 0 3px 0 rgba(0,0,0,.04);
  display:flex;align-items:center;padding:0 8px;gap:5px;overflow-x:auto;overflow-y:hidden;
}
.tags-view::-webkit-scrollbar{height:3px}
.tag{
  display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 8px;
  border:1px solid #d8dce5;background:#fff;color:#495060;font-size:12px;
  cursor:pointer;white-space:nowrap;flex:0 0 auto;
}
.tag:hover{color:var(--el-primary)}
.tag.active{background:#42b983;color:#fff;border-color:#42b983}
.tag.active::before{
  content:"";width:8px;height:8px;border-radius:50%;background:#fff;display:inline-block;
}
.tag .x{
  width:14px;height:14px;border-radius:50%;line-height:12px;text-align:center;
  font-size:12px;font-style:normal;
}
.tag .x:hover{background:#b4bccc;color:#fff}
.tag.active .x:hover{background:rgba(255,255,255,.35)}

.app-main{flex:1;overflow-y:auto;position:relative;min-height:70vh}
.app-container{padding:16px}
.filter-card{margin-bottom:10px}
.filter-card .el-card__body{padding-bottom:0}

/* ---------- el-card ---------- */
.el-card{
  background:#fff;border:1px solid var(--bd-lighter);border-radius:4px;
  box-shadow:0 1px 8px 0 rgba(0,0,0,.05);overflow:hidden;
}
.el-card + .el-card{margin-top:16px}
.el-card__header{
  padding:10px 15px;border-bottom:1px solid var(--bd-lighter);
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-height:44px;
}
.el-card__header .title{font-size:15px;font-weight:600;color:var(--t-primary)}
.el-card__header .sub{font-size:12px;color:var(--t-secondary)}
.el-card__header .hdr-right{margin-left:auto;display:flex;gap:8px;align-items:center}
.el-card__body{padding:15px 20px 20px}
.el-card__body.tight{padding:12px 20px 14px}

/* ---------- inline filter form (el-form :inline) ---------- */
.el-form-inline{display:flex;flex-wrap:wrap;gap:0 10px;align-items:flex-start}
.el-form-item{display:flex;align-items:center;margin-bottom:14px}
.el-form-item__label{
  flex:0 0 auto;text-align:right;color:var(--t-regular);font-size:14px;font-weight:700;
  padding-right:12px;line-height:32px;white-space:nowrap;
}
.el-input,.el-select{
  height:32px;line-height:32px;font-size:13px;color:var(--t-regular);
  border:1px solid var(--bd-base);border-radius:4px;background:#fff;
  padding:0 11px;width:190px;outline:none;transition:border-color .2s;
  font-family:inherit;
}
.el-select{
  padding-right:26px;cursor:pointer;-webkit-appearance:none;appearance:none;
  background-image:url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23c0c4cc' stroke-width='2.4' stroke-linecap='round'%3E%3Cpath d='M6 9l6 6 6-6'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:right 7px center;background-size:13px;
}
.el-input:focus,.el-select:focus{border-color:var(--el-primary)}
.el-input::placeholder{color:var(--t-placeholder)}
.el-input.w-sm,.el-select.w-sm{width:140px}
.el-input.w-lg{width:250px}

/* ---------- buttons ---------- */
.el-button{
  display:inline-flex;align-items:center;justify-content:center;gap:5px;
  height:32px;padding:0 15px;font-size:13px;line-height:1;border-radius:4px;
  border:1px solid var(--bd-base);background:#fff;color:var(--t-regular);
  cursor:pointer;white-space:nowrap;font-family:inherit;transition:.1s;
}
.el-button:hover{color:var(--el-primary);border-color:#c6e2ff;background:var(--el-primary-light)}
.el-button svg{width:14px;height:14px}
.el-button--primary{background:var(--el-primary);border-color:var(--el-primary);color:#fff}
.el-button--primary:hover{background:#66b1ff;border-color:#66b1ff;color:#fff}
.el-button--success{background:var(--el-success);border-color:var(--el-success);color:#fff}
.el-button--success:hover{background:#85ce61;border-color:#85ce61;color:#fff}
.el-button--warning{background:var(--el-warning);border-color:var(--el-warning);color:#fff}
.el-button--warning:hover{background:#ebb563;border-color:#ebb563;color:#fff}
.el-button--danger{background:var(--el-danger);border-color:var(--el-danger);color:#fff}
.el-button--danger:hover{background:#f78989;border-color:#f78989;color:#fff}
.el-button--sm{height:28px;padding:0 11px;font-size:12px}
.el-button[disabled]{opacity:.55;cursor:not-allowed;pointer-events:none}
.el-button--text{
  border:none;background:transparent;color:var(--el-primary);padding:0 6px;height:auto;
}
.el-button--text:hover{background:transparent;color:#66b1ff;text-decoration:underline}
.el-button--text.danger{color:var(--el-danger)}
.el-button--text.danger:hover{color:#f78989}
.el-button--text.warn{color:var(--el-warning)}
.link-a{color:var(--el-primary);cursor:pointer;font-size:13px}
.link-a:hover{text-decoration:underline}

/* ---------- el-table ---------- */
.table-wrap{width:100%;overflow-x:auto}
.el-table{width:100%;border-collapse:separate;border-spacing:0;font-size:13px;color:var(--t-regular)}
.el-table th{
  background:#f8f8f9;color:#515a6e;font-weight:600;text-align:left;
  padding:10px;height:40px;border-bottom:1px solid var(--bd-lighter);white-space:nowrap;font-size:13px;
}
.el-table td{
  padding:9px 10px;border-bottom:1px solid var(--bd-lighter);vertical-align:middle;
}
.el-table tbody tr:hover>td{background:#f5f7fa}
.el-table tbody tr.expanded>td{background:#f5f7fa}
.el-table td.num,.el-table th.num{text-align:right;font-variant-numeric:tabular-nums}
.el-table td.mono,.el-table .mono{
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;
}
.el-table .nowrap{white-space:nowrap}
.el-table tr.expand-row>td{background:#fbfcfd;padding:0;border-bottom:1px solid var(--bd-lighter)}
.el-table .empty-cell{text-align:center;color:var(--t-placeholder);padding:44px 0}
.expand-toggle{
  width:18px;height:18px;border:1px solid var(--bd-base);border-radius:2px;background:#fff;
  display:inline-flex;align-items:center;justify-content:center;cursor:pointer;
  color:var(--t-secondary);font-size:11px;line-height:1;user-select:none;
}
.expand-toggle:hover{border-color:var(--el-primary);color:var(--el-primary)}
.el-checkbox{
  width:14px;height:14px;border:1px solid var(--bd-base);border-radius:2px;background:#fff;
  display:inline-block;cursor:pointer;position:relative;vertical-align:middle;
}
.el-checkbox:hover{border-color:var(--el-primary)}
.el-checkbox.checked{background:var(--el-primary);border-color:var(--el-primary)}
.el-checkbox.checked::after{
  content:"";position:absolute;left:4px;top:1px;width:4px;height:7px;
  border:1px solid #fff;border-top:0;border-left:0;transform:rotate(45deg);
}
.el-checkbox.disabled{background:#edf2fc;border-color:#dcdfe6;cursor:not-allowed}

/* ---------- tags / badges ---------- */
.el-tag{
  display:inline-flex;align-items:center;height:22px;padding:0 8px;font-size:12px;
  border-radius:3px;line-height:1;white-space:nowrap;
  background:var(--el-info-light);color:var(--el-info);border:1px solid #e9e9eb;
}
.el-tag.success{background:var(--el-success-light);color:var(--el-success);border-color:#e1f3d8}
.el-tag.warning{background:var(--el-warning-light);color:var(--el-warning);border-color:#faecd8}
.el-tag.danger{background:var(--el-danger-light);color:var(--el-danger);border-color:#fde2e2}
.el-tag.primary{background:var(--el-primary-light);color:var(--el-primary);border-color:#d9ecff}
.el-tag.sm{height:19px;font-size:11px;padding:0 6px}
.tag-row{display:flex;gap:4px;flex-wrap:wrap}
.flag-dot{
  display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:5px;vertical-align:1px;
}
.exc-flag{
  display:inline-flex;align-items:center;gap:4px;font-size:11.5px;color:var(--el-danger);
  background:var(--el-danger-light);border:1px solid #fde2e2;border-radius:3px;padding:1px 6px;
}
.internal-col{background:#fffdf5}
.el-table th.internal-col{background:#fdf6ec;color:#a4741f}

/* ---------- pagination ---------- */
.pagination{
  display:flex;align-items:center;gap:8px;padding:14px 4px 2px;justify-content:flex-end;
  font-size:13px;color:var(--t-regular);
}
.pagination .pg{
  min-width:28px;height:28px;padding:0 6px;border-radius:2px;background:#f4f4f5;
  display:inline-flex;align-items:center;justify-content:center;cursor:pointer;font-size:13px;
}
.pagination .pg.active{background:var(--el-primary);color:#fff}
.pagination .total{margin-right:auto;color:var(--t-secondary);font-size:13px}

/* ---------- descriptions / detail grids ---------- */
.desc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:0;border:1px solid var(--bd-lighter);border-radius:4px;overflow:hidden}
.desc-cell{display:flex;border-bottom:1px solid var(--bd-lighter);border-right:1px solid var(--bd-lighter);min-height:40px}
.desc-cell .k{
  flex:0 0 108px;background:#fafafa;padding:9px 12px;color:var(--t-regular);
  font-size:13px;font-weight:500;
}
.desc-cell .v{padding:9px 12px;font-size:13px;color:var(--t-primary);word-break:break-all}

/* ---------- stat tiles ---------- */
.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.stat{
  background:#fff;border:1px solid var(--bd-lighter);border-radius:4px;padding:16px 18px;
  box-shadow:0 1px 8px 0 rgba(0,0,0,.05);
}
.stat .lbl{font-size:13px;color:var(--t-secondary);display:flex;align-items:center;gap:6px}
.stat .val{font-size:24px;font-weight:600;color:var(--t-primary);margin-top:8px;font-variant-numeric:tabular-nums}
.stat .val small{font-size:13px;font-weight:400;color:var(--t-secondary);margin-left:4px}
.stat .foot{font-size:12px;color:var(--t-secondary);margin-top:6px}
.stat .foot .up{color:var(--el-success)}
.stat .foot .down{color:var(--el-danger)}
.stat.accent{border-left:3px solid var(--el-primary)}
.stat.warn{border-left:3px solid var(--el-warning)}
.stat.danger{border-left:3px solid var(--el-danger)}

/* ---------- tabs ---------- */
.el-tabs{border-bottom:1px solid var(--bd-light);display:flex;gap:0;padding:0 20px;background:#fff;flex-wrap:wrap}
.el-tab{
  padding:0 20px;height:40px;line-height:40px;font-size:14px;color:var(--t-regular);
  cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;
}
.el-tab:hover{color:var(--el-primary)}
.el-tab.active{color:var(--el-primary);border-bottom-color:var(--el-primary);font-weight:500}

/* ---------- expanded balance panel ---------- */
.bal-panel{padding:14px 18px 16px 46px}
.bal-panel .bp-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.bal-panel .bp-head .t{font-size:13px;font-weight:600;color:var(--t-primary)}
.bal-panel .bp-head .ts{font-size:12px;color:var(--t-secondary)}
.bal-table{width:100%;border-collapse:separate;border-spacing:0;background:#fff;border:1px solid var(--bd-lighter);border-radius:3px}
.bal-table th{background:#f8f8f9;font-size:12px;color:#515a6e;padding:7px 10px;text-align:left;border-bottom:1px solid var(--bd-lighter);font-weight:600}
.bal-table td{padding:7px 10px;font-size:12.5px;border-bottom:1px solid var(--bd-lighter);color:var(--t-regular)}
.bal-table tr:last-child td{border-bottom:none}
.bal-table td.num,.bal-table th.num{text-align:right;font-variant-numeric:tabular-nums}
.bal-table tr.cny-row td{background:#fffdf5}
.chain-chip{
  display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:var(--t-primary);
}
.chain-chip .cc{
  width:18px;height:18px;border-radius:50%;background:#eef2f7;color:#5a6b80;
  font-size:9px;display:inline-flex;align-items:center;justify-content:center;font-weight:700;
}
.hint-note{
  font-size:12px;color:var(--t-secondary);background:#f8f9fb;border-left:3px solid #c8d3e0;
  padding:7px 12px;border-radius:0 3px 3px 0;margin-top:10px;line-height:1.6;
}

/* ---- 质押额度使用率进度条（卡商法币信用额度） ---- */
.util-bar{
  height:6px;border-radius:3px;background:#ebeef5;overflow:hidden;min-width:90px;margin-top:4px;
}
.util-bar i{display:block;height:100%;border-radius:3px;background:var(--el-success);transition:width .3s}
.util-bar i.warn{background:var(--el-warning)}
.util-bar i.danger{background:var(--el-danger)}
.util-cap{font-size:11px;color:var(--t-secondary);margin-top:3px;font-variant-numeric:tabular-nums}
.credit-note{
  font-size:11.5px;color:var(--el-danger);background:var(--el-danger-light);
  border:1px solid #fde2e2;border-radius:3px;padding:1px 6px;display:inline-block;margin-top:4px;
}

/* ---------- 客户付款凭证（管理端只读查阅） ---------- */
.proof-box{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.proof-thumb{
  width:136px;height:94px;border:1px solid var(--bd-base);border-radius:4px;overflow:hidden;
  background:#fff;cursor:zoom-in;flex:0 0 auto;position:relative;display:block;
}
.proof-thumb:hover{border-color:var(--el-primary);box-shadow:0 0 0 2px var(--el-primary-light)}
.proof-thumb img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.proof-thumb .zoom{
  position:absolute;right:0;bottom:0;background:rgba(0,0,0,.52);color:#fff;font-size:10px;
  padding:1px 6px;border-radius:3px 0 0 0;pointer-events:none;
}
.proof-meta{font-size:12px;color:var(--t-secondary);line-height:1.85;min-width:200px;flex:1}
.proof-meta b{color:var(--t-regular);font-weight:600}
.proof-meta .ro{color:var(--t-placeholder);font-size:11.5px}
.proof-none{font-size:12px;color:var(--t-placeholder);line-height:1.7}
.proof-view{width:100%;max-width:520px;display:block;margin:0 auto;
  border:1px solid var(--bd-lighter);border-radius:4px;background:#f5f7fa}
.proof-chip{
  display:inline-flex;align-items:center;gap:3px;font-size:11px;color:var(--el-primary);
  background:var(--el-primary-light);border:1px solid #d9ecff;border-radius:3px;padding:0 5px;
  line-height:17px;margin-left:2px;
}

/* ---------- pricing chain ---------- */
.price-chain{display:flex;align-items:center;gap:5px;white-space:nowrap;font-variant-numeric:tabular-nums}
.price-chain .pc{font-size:12px;color:var(--t-secondary)}
.price-chain .pc b{font-weight:600;color:var(--t-regular);font-family:ui-monospace,Menlo,monospace}
.price-chain .pc.final b{color:var(--el-primary)}
.price-chain .ar{color:#c0c4cc;font-size:11px}
.profit-pos{color:var(--el-success);font-weight:600;font-variant-numeric:tabular-nums}
.profit-neg{color:var(--el-danger);font-weight:600;font-variant-numeric:tabular-nums}

/* ---------- dialog ---------- */
.mask{
  position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:2200;
  display:none;align-items:flex-start;justify-content:center;
}
.mask.open{display:flex}
.el-dialog{

<script>
"use strict";
/* =========================================================================
   PayPaz 渠道 · 合作伙伴 · 佣金分配系统（原型）
   实现依据：paypaz-commission-system-design.md v0.1
   结构沿用 admin-console.html 的 NAV / PAGE_META / PAGES / verifyRegistry 模式
   ========================================================================= */

/* =========================================================================
   0. tiny helpers
   ========================================================================= */
function $(id){ return document.getElementById(id); }
function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function n2(v){ return Number(v).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function pct(v){ return Number(v).toFixed(2)+'%'; }
function r2(v){ return Math.round(Number(v)*100)/100; }
function pad(n,w){ var s=String(n); while(s.length<w) s='0'+s; return s; }
function rows(keys,data){
  return data.map(function(arr){
    var o={};
    keys.forEach(function(k,i){ o[k]=arr[i]; });
    return o;
  });
}
function nowStr(){
  var d=new Date();
  return d.getFullYear()+'-'+pad(d.getMonth()+1,2)+'-'+pad(d.getDate(),2)+' '+
         pad(d.getHours(),2)+':'+pad(d.getMinutes(),2)+':'+pad(d.getSeconds(),2);
}
function toast(msg,type){
  var w=$('toastWrap');
  var d=document.createElement('div');
  d.className='toast '+(type||'success');
  d.innerHTML='<span>'+esc(msg)+'</span>';
  w.appendChild(d);
  setTimeout(function(){ d.remove(); },3200);
}
var ICONS={
  link:'<path d="M10 13a5 5 0 0 0 7.1 0l2.6-2.6a5 5 0 0 0-7.1-7.1L11 4.9"/><path d="M14 11a5 5 0 0 0-7.1 0L4.3 13.6a5 5 0 0 0 7.1 7.1L13 19.1"/>',
  user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/>',
  shop:'<path d="M3 9l1.6-5h14.8L21 9M3 9h18v11H3zM9 20v-6h6v6"/>',
  coin:'<circle cx="12" cy="12" r="9"/><path d="M9.5 9h4.2a1.9 1.9 0 0 1 0 3.8H9.5m0 0h5.4"/>'
};
function icon(k){

/* =========================================================================
   1. seed data
   ========================================================================= */

/* ---- 1.1 渠道：每个渠道一套充提币收费规则，【替换】而非叠加「代币」菜单的基础费率 ---- */
var BASE_FEE={deposit:0.10,withdraw:0.15};   /* 「代币」菜单的基础费率，仅用于对比展示 */

 ['id','name','depositFeeRate','withdrawFeeRate','status','createTime','note'],

 ['CH-02','IB 经纪联盟',0.20,0.28,'enable','2025-11-06 15:41:07','多个独立 IB 拼成的联盟渠道'],
 ['CH-03','亚太引流合作',0.35,0.40,'disable','2026-02-24 09:17:50','试点后暂停，停用后不再产生新配置']
]);
function channel(id){ for(var i=0;i<CHANNELS.length;i++){ if(CHANNELS[i].id===id) return CHANNELS[i]; } return null; }

/* ---- 1.2 合作伙伴：挂在渠道下，walletAddress 为预留字段，本期不接打款 ---- */
var PARTNERS=rows(
 ['id','channelId','name','contact','walletAddress','status','createTime'],
[
 ['P-101','CH-01','张伟（亚太 IB）','wei.zhang@mt-ib.asia / +65 8***2201','TKq7nB4xW9pR2vL6sD8mA1yE5jH3cZfUgQ','enable','2025-04-18 10:30:22'],
 ['P-102','CH-01','Orion Capital Ltd.','ops@orioncap.io / +44 20 ****8810','0x4A7bC2e9F1d63B58aE0c7D2f9B4a6C1E8d3F5b70','enable','2025-05-09 11:12:40'],
 ['P-103','CH-01','李静（华南直客）','jing.li@partner.cn / +86 138****6620','','disable','2025-09-01 16:44:03'],
 ['P-201','CH-02','汇金引流工作室','hj-studio@mail.com / +86 139****3311','TB3mV8qY2wK5eN7sR1aD9jC4hX6fLpZuTn','enable','2025-11-06 16:02:55'],
 ['P-202','CH-02','Bright Path Media','finance@brightpath.media / +1 ***-2140','0x9E2dF7a4C8b13D50fA6e9B2c7D4a1F8E5b0C3d29','enable','2026-01-15 14:20:18'],
 ['P-301','CH-03','南洋直客部','nanyang.direct@paypaz.tech','','enable','2026-02-24 09:40:12'],
 ['P-302','CH-03','Kevin Tan','kevin.tan@apac-lead.sg / +65 9***7742','TD6yA1nQ8vM3wS5eK2rB7jP4hF9cXzLuTb','enable','2026-03-02 10:05:36']
]);
function partner(id){ for(var i=0;i<PARTNERS.length;i++){ if(PARTNERS[i].id===id) return PARTNERS[i]; } return null; }
function pname(id){ var p=partner(id); return p?p.name:(id||'—'); }
function partnersOf(chId){ return PARTNERS.filter(function(p){ return p.channelId===chId; }); }

/* ---- 1.3 商户（broker），与 admin-console.html 同一批商户 ---- */
var MERCHANTS=rows(
 ['id','name','userId'],
[
 ['BR-1001','明汇国际支付有限公司',100241],
 ['BR-1002','星舟数字科技（香港）有限公司',100377],
 ['BR-1003','汇丰通商务服务有限公司',100415],
 ['BR-1004','南洋跨境结算私人有限公司',100488],
 ['BR-1005','恒昌资本管理有限公司',100503],
 ['BR-1006','澜海支付科技有限公司',100519]
]);
function merchant(id){ for(var i=0;i<MERCHANTS.length;i++){ if(MERCHANTS[i].id===id) return MERCHANTS[i]; } return null; }
function mname(id){ var m=merchant(id); return m?m.name:(id||'—'); }
function mshort(id){ var m=merchant(id); return m?m.name.replace(/（.*?）/g,'').slice(0,6):(id||'—'); }

/* ---- 1.4 商户的渠道配置（当前生效值；订单产生佣金时被快照进 LEDGER）----
   rate = 返佣比例，口径是「该渠道手续费收入的百分比」，同商户下各合作伙伴之和 <= 100%。
   addr = 该商户在该渠道下的专属充值地址（复用 SubWalletAddress.partnerCode 分流机制）。 */
var MCFG={
 'BR-1001':{channelId:'CH-01',picks:[{partnerId:'P-101',rate:60},{partnerId:'P-102',rate:30}],
            addr:'TUq2Meta1001xP7vR4dK9sB6nY3hE8jLcZ',openapi:true,time:'2025-05-10 09:20:11'},
 'BR-1002':{channelId:'CH-01',picks:[{partnerId:'P-102',rate:50}],
            addr:'TVr5Meta1002yQ8wS3eL1mC7bX4kA6nFdGh',openapi:true,time:'2025-06-02 11:45:33'},
 'BR-1004':{channelId:'CH-02',picks:[{partnerId:'P-201',rate:40},{partnerId:'P-202',rate:35}],
            addr:'TWs8Ibal1004zR1xT6fM4nD9cV2pB5jHeKq',openapi:true,time:'2025-12-11 15:02:47'},
 'BR-1006':{channelId:'CH-02',picks:[{partnerId:'P-201',rate:100}],
            addr:'TXt3Ibal1006aS4yU9gN7pF2dW6qC1kJmLr',openapi:true,time:'2026-01-20 10:11:09'}
};
function mcfg(mid){ return MCFG[mid]||null; }
function cfgRateOf(mid,pid){
  var c=mcfg(mid); if(!c) return 0;
  for(var i=0;i<c.picks.length;i++){ if(c.picks[i].partnerId===pid) return c.picks[i].rate; }
  return 0;
}
function merchantsOfChannel(chId){
  return Object.keys(MCFG).filter(function(m){ return MCFG[m].channelId===chId; });
}
function merchantsOfPartner(pid){
  return Object.keys(MCFG).filter(function(m){
    return MCFG[m].picks.some(function(p){ return p.partnerId===pid; });
  });
}
/* 专属充值地址：原型内用确定性伪地址代替真实 SubWalletAddress 分配 */
function genAddr(mid,chId){
  var seed=0x811c9dc5, s=mid+'|'+chId;
  for(var i=0;i<s.length;i++){ seed=(seed^s.charCodeAt(i))>>>0; seed=(seed*16777619)>>>0; }
  var abc='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz123456789';
  var out='T';
  for(var j=0;j<33;j++){
    seed^=seed<<13; seed>>>=0; seed^=seed>>>17; seed^=seed<<5; seed>>>=0;
    out+=abc[seed%abc.length];
  }
  return out;
}

/* ---- 1.5 订单：只保留佣金计算需要的字段。feeAmount 为当前手续费，origFee 为首次扣费金额 ---- */
var ORDERS=rows(
 ['orderId','orderType','merchantId','feeAmount','origFee','token','createTime','refundRef'],
[
 ['ORD-D-20260915-0011','DEPOSIT','BR-1001',420.00,420.00,'USDT','2026-09-15 10:22:31',''],
 ['ORD-D-20260916-0027','DEPOSIT','BR-1001',700.00,980.00,'USDT','2026-09-16 14:05:02','RFD-20260917-0031'],
 ['ORD-W-20260917-0044','WITHDRAW','BR-1002',310.00,310.00,'USDT','2026-09-17 09:38:14',''],
 ['ORD-D-20260918-0052','DEPOSIT','BR-1004',640.00,640.00,'USDT','2026-09-18 13:47:56',''],
 ['ORD-W-20260918-0061','WITHDRAW','BR-1006',150.00,150.00,'USDT','2026-09-18 17:20:03',''],
 ['ORD-D-20260919-0073','DEPOSIT','BR-1001',1250.00,1250.00,'USDT','2026-09-19 11:02:44',''],
 ['ORD-D-20260919-0080','DEPOSIT','BR-1004',880.00,880.00,'USDT','2026-09-19 16:55:21',''],
 ['ORD-W-20260920-0094','WITHDRAW','BR-1002',205.00,205.00,'USDT','2026-09-20 10:14:37',''],
 ['ORD-D-20260921-0102','DEPOSIT','BR-1006',460.00,520.00,'USDT','2026-09-21 09:05:50','RFD-20260921-0018']
]);
function orderById(id){ for(var i=0;i<ORDERS.length;i++){ if(ORDERS[i].orderId===id) return ORDERS[i]; } return null; }

/* =========================================================================
   2. 佣金流水（只追加不修改）+ 退款自动调整算法（设计文档 §4.2 / §4.3）
   ========================================================================= */
var LEDGER=[];
var ENTRY_SEQ=0;
function nextEntryId(){ return 'CE-'+pad(++ENTRY_SEQ,6); }

/* 生成一条佣金记录：所有随配置变化的字段（feeAmount / rebateRate）在这里被快照固化 */
function pushEntry(o){
  var e={
    id:nextEntryId(),
    orderId:o.orderId, orderType:o.orderType,
    merchantId:o.merchantId, channelId:o.channelId, partnerId:o.partnerId,
    feeAmount:r2(o.feeAmount),          /* 手续费金额快照 */
    rebateRate:o.rebateRate,            /* 返佣比例快照（% of 手续费） */
    amount:r2(o.amount),                /* 本条金额，调整记录可为负 */
    entryType:o.entryType,              /* ORIGINAL | ADJUSTMENT */
    adjustRefOrderId:o.adjustRefOrderId||'',
    status:o.status||'PENDING',         /* PENDING | PROCESSED */
    processedBy:o.processedBy||'', processedAt:o.processedAt||'',
    createTime:o.createTime||nowStr()
  };
  LEDGER.push(e);
  return e;
}
function entriesOfOrder(orderId){
  return LEDGER.filter(function(e){ return e.orderId===orderId; });
}

/* 订单扣费完成 → 实时按当时配置生成 ORIGINAL 记录（§4.1，系统内无等待期） */
function genOriginal(ord,feeAmount,time){
  var c=mcfg(ord.merchantId);
  if(!c) return [];
  return c.picks.map(function(p){
    return pushEntry({
      orderId:ord.orderId, orderType:ord.orderType, merchantId:ord.merchantId,
      channelId:c.channelId, partnerId:p.partnerId,
      feeAmount:feeAmount, rebateRate:p.rate,
      amount:feeAmount*p.rate/100,
      entryType:'ORIGINAL', createTime:time||ord.createTime
    });
  });
}

/* ---- §4.3 步骤 2~4：找出该订单全部记录 → 用【快照返佣比例】× 新手续费重算 → 与已产生总和求差 ---- */
function computeAdjust(orderId,newFee){
  var byPartner=entriesOfOrder(orderId).reduce(function(m,e){
    if(!m[e.partnerId]){
      m[e.partnerId]={partnerId:e.partnerId,channelId:e.channelId,merchantId:e.merchantId,
        orderType:e.orderType,rate:null,paid:0,n:0};
    }
    var o=m[e.partnerId];
    if(e.entryType==='ORIGINAL') o.rate=e.rebateRate;   /* 快照比例只认原始记录 */
    o.paid=r2(o.paid+e.amount);
    o.n++;
    return m;
  },{});
  return Object.keys(byPartner).map(function(k){
    var o=byPartner[k];
    o.due=r2(newFee*(o.rate||0)/100);   /* 步骤3：应得佣金 */
    o.diff=r2(o.due-o.paid);            /* 步骤4：差额 */
    return o;
  });
}
/* ---- §4.3 步骤 5：差额不为零 → 每个受影响伙伴各追加一条 ADJUSTMENT，原始记录永不修改 ---- */
function applyAdjust(orderId,newFee,refId,time){
  var plan=computeAdjust(orderId,newFee);
  var added=plan.filter(function(o){ return o.diff!==0; }).map(function(o){
    return pushEntry({
      orderId:orderId, orderType:o.orderType, merchantId:o.merchantId,
      channelId:o.channelId, partnerId:o.partnerId,
      feeAmount:newFee, rebateRate:o.rate,
      amount:o.diff,
      entryType:'ADJUSTMENT', adjustRefOrderId:refId,
      createTime:time||nowStr()
    });
  });
  var ord=orderById(orderId);
  if(ord){ ord.feeAmount=r2(newFee); ord.refundRef=refId; }
  return added;
}

/* ---- 2.1 种子流水：先按 origFee 生成全部 ORIGINAL，再对已退款订单跑一次真实调整算法 ----
   （种子里的历史 ADJUSTMENT 记录就是 applyAdjust 自己算出来的，不是手写死的数字） */
ORDERS.forEach(function(o){ genOriginal(o,o.origFee,o.createTime); });
applyAdjust('ORD-D-20260916-0027',700.00,'RFD-20260917-0031','2026-09-17 15:31:08');
applyAdjust('ORD-D-20260921-0102',460.00,'RFD-20260921-0018','2026-09-21 14:12:26');
/* 运营已线下处理过的几条（§4.4：标记只作流程追溯，且各条状态互相独立）*/
['ORD-D-20260915-0011','ORD-W-20260917-0044'].forEach(function(oid){

     已处理记录不回滚、不改动，新调整记录独立为 PENDING —— 正是 §4.4 要求的表现 */
  if(e.orderId==='ORD-D-20260916-0027'&&e.partnerId==='P-101'&&e.entryType==='ORIGINAL'){
    e.status='PROCESSED'; e.processedBy='ops.amos'; e.processedAt='2026-09-17 09:12:05';
  }
});

/* ---- 2.2 净额汇总：只从「当前可见的记录」reduce 出来，不单独存储（§4.3 步骤6） ---- */
function netByPartner(list){
  var m=list.reduce(function(acc,e){
    if(!acc[e.partnerId]){
      acc[e.partnerId]={partnerId:e.partnerId,channelId:e.channelId,
        orig:0,adj:0,net:0,pending:0,processed:0,n:0,adjN:0,pendingIds:[]};
    }
    var o=acc[e.partnerId];
    if(e.entryType==='ORIGINAL') o.orig=r2(o.orig+e.amount);
    else { o.adj=r2(o.adj+e.amount); o.adjN++; }
    o.net=r2(o.net+e.amount);
    if(e.status==='PENDING'){ o.pending=r2(o.pending+e.amount); o.pendingIds.push(e.id); }
    else o.processed=r2(o.processed+e.amount);
    o.n++;
    return acc;
  },{});
  return Object.keys(m).map(function(k){ return m[k]; })
    .sort(function(a,b){ return b.net-a.net; });
}
function sumBy(list,fn){ return r2(list.reduce(function(s,e){ return s+fn(e); },0)); }

function savePartner(id){
  var name=$('ptName').value.trim();
  if(!name){ toast('请填写合作伙伴名称','warning'); return; }
  var chId=$('ptCh').value;
  var st=$('ptStatus').classList.contains('on')?'enable':'disable';
  var contact=$('ptContact').value.trim(), addr=$('ptAddr').value.trim();
  if(id){
    var p=partner(id);
    p.name=name; p.channelId=chId; p.contact=contact; p.walletAddress=addr; p.status=st;
  }else{
    var n=parseInt(chId.slice(3),10)*100;
    PARTNERS.forEach(function(x){ if(x.channelId===chId) n=Math.max(n,parseInt(x.id.slice(2),10)); });

      walletAddress:addr,status:st,createTime:nowStr()});
  }
  state.partnerTab=chId;
  closeDialog(); render();
  toast(id?('合作伙伴「'+name+'」已保存'):('合作伙伴「'+name+'」已加入渠道「'+chname(chId)+'」'));

function cfgDraft(){
  if(!state.cfg){
    var mid=MERCHANTS[0].id;
    state.cfg=draftFor(mid);
  }
  return state.cfg;
}
function draftFor(mid){
  var c=mcfg(mid);
  var picks={};
  if(c) c.picks.forEach(function(p){ picks[p.partnerId]=p.rate; });
  return {mid:mid,channelId:c?c.channelId:'',picks:picks};
}
function draftSum(d){
  return r2(Object.keys(d.picks).reduce(function(s,k){ return s+(Number(d.picks[k])||0); },0));
}
function allocHtml(d){
  var sum=draftSum(d);
  var over=sum>100;
  var pctW=Math.max(0,Math.min(100,sum));
  return '<div class="alloc'+(over?' over':'')+'">'+
    '<div class="alloc-top"><span>已分配 <b>'+sum.toFixed(2)+'%</b> / 可用 100.00%</span>'+
    '<span class="'+(over?'bad':'ok')+'">'+(over?('超出 '+r2(sum-100).toFixed(2)+'%，无法保存'):('剩余 '+r2(100-sum).toFixed(2)+'%'))+'</span></div>'+
    '<div class="util-bar"><i class="'+(over?'danger':(sum>=95?'warn':''))+'" style="width:'+pctW+'%"></i></div>'+
    '<div class="muted small" style="margin-top:6px">返佣比例的口径是「该渠道手续费收入的百分比」。'+
    '每个合作伙伴各自独立拿一份，互不共享；本商户下所有合作伙伴之和必须 ≤ 100%（即不能分掉超过手续费全额）。</div>'+

function updateAlloc(){

  partnersOf(ch.id).forEach(function(p){

    cell.innerHTML=(d.picks[p.id]!=null)

function saveCfg(){
  var d=state.cfg;
  if(!d.channelId){ toast('请选择渠道','warning'); return; }
  var pids=Object.keys(d.picks);
  if(!pids.length){ toast('请至少选择一个合作伙伴并填写返佣比例','warning'); return; }
  var bad=pids.filter(function(k){ var v=Number(d.picks[k]); return !isFinite(v)||v<=0; });
  if(bad.length){ toast('「'+pname(bad[0])+'」的返佣比例必须是大于 0 的数字','warning'); return; }
  var sum=draftSum(d);
  /* 核心校验（设计文档 §1）：各合作伙伴返佣比例之和不得超过渠道手续费金额的 100% */
  if(sum>100){
    toast('保存被拒绝：已分配 '+sum.toFixed(2)+'%，超出渠道手续费的 100%（超 '+r2(sum-100).toFixed(2)+
      '%）。返佣总额不能大于该渠道收到的手续费。','warning');
    return;
  }
  var first=!mcfg(d.mid);
  MCFG[d.mid]={
    channelId:d.channelId,
    picks:pids.map(function(k){ return {partnerId:k,rate:r2(Number(d.picks[k]))}; }),
    addr:(mcfg(d.mid)&&mcfg(d.mid).channelId===d.channelId)?mcfg(d.mid).addr:genAddr(d.mid,d.channelId),
    openapi:true,
    time:nowStr()
  };
  state.cfg=draftFor(d.mid);
  render();
  toast(first
    ? ('配置已保存：OpenAPI 已为「'+mshort(d.mid)+'」开通「'+chname(d.channelId)+'」调用权限，并已生成该渠道专属充值地址')
    : ('配置已更新（已分配 '+sum.toFixed(2)+'%）；仅对新订单生效，历史佣金记录不变'));
}

}
function refundApply(orderId){
  var ord=orderById(orderId);
  var newFee=Number($('rfFee')?$('rfFee').value:NaN);
  if(!isFinite(newFee)||newFee<0){ toast('请输入合法的新手续费金额','warning'); return; }
  if(newFee>ord.origFee){
    toast('新手续费不能高于首次扣费金额 '+n2(ord.origFee)+'（退款只会让手续费变少）','warning');
    return;
  }
  var refId='RFD-'+nowStr().slice(0,10).replace(/-/g,'')+'-'+pad(++REFUND_SEQ,4);
  var added=applyAdjust(orderId,newFee,refId,nowStr());
  closeDialog();
  render();
  if(!added.length){
    toast('差额为 0，未产生任何调整记录（原始记录保持不变）','info');
  }else{
    toast('退款事件 '+refId+' 已处理：手续费 '+n2(ord.origFee)+' → '+n2(newFee)+
      '，自动追加 '+added.length+' 条 ADJUSTMENT 记录（'+
      added.map(function(e){ return pname(e.partnerId)+' '+signed(e.amount); }).join('，')+
      '）；原始记录及其已处理状态均未改动');
  }
}

/* 每个导航/页面键都必须同时有 PAGE_META 标签与 PAGES 渲染函数，
   否则面包屑/页签会渲染出 undefined —— 这个自检在同系列原型里抓到过多次漏标签的问题 */
function verifyRegistry(){
  var problems=[];
  Object.keys(PAGE_META).forEach(function(k){
    if(!PAGE_META[k]||!PAGE_META[k].title) problems.push('PAGE_META['+k+'] 缺少 title');
    if(typeof PAGES[k]!=='function') problems.push('PAGES['+k+'] 缺少渲染函数');
  });
  Object.keys(PAGES).forEach(function(k){
    if(!PAGE_META[k]) problems.push('PAGE_META['+k+'] 缺失（面包屑会显示 undefined）');
  });
  var seen={};
  function leaf(k,label){
    if(seen[k]) problems.push('导航键 '+k+' 重复出现');
    seen[k]=true;
    if(!PAGE_META[k]) problems.push('导航项 '+k+'（'+label+'）未注册 PAGE_META');
    if(typeof PAGES[k]!=='function') problems.push('导航项 '+k+'（'+label+'）未注册渲染函数');
  }
  NAV.forEach(function(g){
    if(g.children){
      if(seen[g.key]) problems.push('导航键 '+g.key+' 重复出现');
      seen[g.key]=true;
      g.children.forEach(function(c){ leaf(c.key,c.label); });
    }else leaf(g.key,g.label);
  });
  var actual=NAV.map(function(g){ return g.key; });
  if(actual.join(',')!==NAV_ORDER_EXPECT.join(','))
    problems.push('一级导航顺序不符：期望 ['+NAV_ORDER_EXPECT.join(' > ')+']，实际 ['+actual.join(' > ')+']');
  Object.keys(NAV_CHILDREN_EXPECT).forEach(function(gk){
    var g=null;
    NAV.forEach(function(x){ if(x.key===gk) g=x; });
    if(!g||!g.children){ problems.push('分组 '+gk+' 应为父级菜单（缺少 children）'); return; }
    var kids=g.children.map(function(c){ return c.key; });
    if(kids.join(',')!==NAV_CHILDREN_EXPECT[gk].join(','))
      problems.push('分组 '+gk+' 子项不符');
  });
  NAV.forEach(function(g){
    if(!g.children) return;
    if(PAGE_META[g.key]) problems.push('父级分组 '+g.key+' 不应注册 PAGE_META');
    if(PAGES[g.key]) problems.push('父级分组 '+g.key+' 不应注册渲染函数');
  });
  RETIRED_KEYS.forEach(function(k){
    if(seen[k]) problems.push('已下线页面 '+k+' 仍出现在 NAV 中');
    if(PAGE_META[k]) problems.push('已下线页面 '+k+' 仍残留 PAGE_META');
    if(PAGES[k]) problems.push('已下线页面 '+k+' 仍残留渲染函数');
  });
  if(problems.length){
    console.error('[registry check] 发现问题:',problems);
    toast('导航注册表异常: '+problems[0],'warning');
  }else{
    console.log('[registry check] OK — '+Object.keys(PAGE_META).length+
      ' 个页面键全部具备标签与渲染函数；一级导航顺序 ['+actual.join(' > ')+']');
  }
  return problems;
}

/* 业务规则自检：种子数据与佣金算法必须满足设计文档的三条硬约束 */
function verifyData(){
  var bad=[];
  /* 1) 任一商户下各合作伙伴返佣比例之和 <= 100%（渠道手续费的全额） */
  Object.keys(MCFG).forEach(function(mid){
    var c=MCFG[mid];
    var s=r2(c.picks.reduce(function(a,p){ return a+p.rate; },0));
    if(s>100) bad.push(mname(mid)+' 返佣比例合计 '+s+'% > 100%');
    c.picks.forEach(function(p){
      var pt=partner(p.partnerId);
      if(!pt) bad.push(mname(mid)+' 引用了不存在的合作伙伴 '+p.partnerId);
      else if(pt.channelId!==c.channelId) bad.push(mname(mid)+' 的合作伙伴 '+pt.name+' 不属于所配渠道');
    });
  });
  /* 2) 每条佣金记录的引用都必须存在，且金额 = 手续费快照 × 比例快照（调整记录为差额，单独校验） */
  LEDGER.forEach(function(e){
    if(!merchant(e.merchantId)||!channel(e.channelId)||!partner(e.partnerId))
      bad.push(e.id+' 引用了不存在的商户/渠道/合作伙伴');
    if(e.entryType==='ORIGINAL'&&e.amount!==r2(e.feeAmount*e.rebateRate/100))
      bad.push(e.id+' 原始金额与快照不一致');
    if(e.entryType==='ADJUSTMENT'&&!e.adjustRefOrderId)
      bad.push(e.id+' 调整记录缺少 adjustRefOrderId');
  });
  /* 3) 调整算法的不变式：每个订单每个合作伙伴的净额 === 当前手续费 × 快照比例 */
  ORDERS.forEach(function(o){
    var byP=entriesOfOrder(o.orderId).reduce(function(m,e){
      if(!m[e.partnerId]) m[e.partnerId]={rate:null,net:0};
      if(e.entryType==='ORIGINAL') m[e.partnerId].rate=e.rebateRate;
      m[e.partnerId].net=r2(m[e.partnerId].net+e.amount);
      return m;
    },{});
    Object.keys(byP).forEach(function(pid){
      var want=r2(o.feeAmount*byP[pid].rate/100);
      if(byP[pid].net!==want)
        bad.push(o.orderId+' / '+pname(pid)+' 净额 '+byP[pid].net+' ≠ 当前手续费×快照比例 '+want);
    });
  });
  if(bad.length){
    console.error('[data check] 发现问题:',bad);
    toast('业务数据自检异常: '+bad[0],'warning');
  }else{
    console.log('[data check] OK — '+Object.keys(MCFG).length+' 份商户渠道配置比例合计均 ≤100%；'+
      LEDGER.length+' 条佣金记录快照一致；'+ORDERS.length+
      ' 笔订单的「原始+调整」净额均等于 当前手续费 × 快照返佣比例');
  }
  return bad;
}

verifyRegistry();
verifyData();
render();
</script>
